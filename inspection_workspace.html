<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>قسم التفتيش | إدارة الحماية والسلامة</title>
  <script src="central_data.js"></script>
  <style>
    :root{--ink:#101b35;--blue:#2359c6;--red:#bd2634;--muted:#64748b;--bg:#f3f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}.top{background:var(--ink);color:#fff;padding:15px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800}.role{font-size:13px;color:#b8cbff}.logout{border:1px solid #ffffff55;background:transparent;color:#fff;border-radius:8px;padding:9px 14px;cursor:pointer}.page{max-width:1300px;margin:0 auto;padding:28px 5%}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.hero h1{margin:0;font-size:27px}.hero p{margin:8px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border:1px solid #e5eaf3;border-radius:14px;box-shadow:0 7px 20px #1d31600a}.card{padding:18px}.card b{display:block;font-size:26px;margin-top:8px}.card span{color:var(--muted);font-size:13px}.panel{padding:21px;margin-top:18px}.panel h2{font-size:18px;margin:0 0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;border-top:1px solid #edf0f5;padding:14px 0}.row:first-of-type{border-top:0}.row small{color:var(--muted);display:block;margin-top:5px}.badge{font-size:12px;font-weight:700;border-radius:99px;padding:5px 9px;background:#e8efff;color:#234d9d}.urgent{background:#fff0f1;color:#a01d2a}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid #d9e1ef;border-radius:8px;font:inherit}.form textarea{grid-column:span 3;min-height:80px}.button{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.button.red{background:var(--red)}.button.light{background:#eef3ff;color:#1747aa}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #ccd7ea;border-radius:10px}.split{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.form textarea{grid-column:span 1}.split{grid-template-columns:1fr}.hero{display:block}.top{padding:14px}.page{padding:20px}}
  </style>
</head>
<body>
<header class="top"><div><div class="brand">إدارة الحماية والسلامة من الحريق</div><div class="role" id="roleTitle"></div></div><div><b id="displayName">ABDULLA ALMAJED</b> <button class="logout" onclick="logout()">تسجيل الخروج</button></div></header>
<main class="page"><section class="hero"><div><h1 id="pageTitle">قسم التفتيش</h1><p id="pageDescription"></p></div><span class="badge" id="roleBadge"></span></section><div id="workspace"></div></main>
<script>
const session=JSON.parse(localStorage.getItem('currentUser')||'null');
const roleMeta={CENTER_INSPECTOR:{name:'مفتش مركز',desc:'متابعة المخالفات والزيارات الميدانية وإعادة التفتيش.',mode:'center'},INSPECTION_EXAMINER:{name:'مفتش فاحص',desc:'فحص قبل الافتتاح وفحص المخالفات باستخدام المتطلبات المسجلة.',mode:'examiner'},INSPECTION_OFFICER_EMPLOYEE:{name:'موظف مفتش',desc:'تدقيق التقارير والمخالفات واعتمادها أو إعادتها للاستكمال.',mode:'review'},INSPECTION_OFFICER:{name:'ضابط التفتيش',desc:'الإشراف على الأعمال والطلبات والمخاطر وتوزيع الفحوصات.',mode:'command'},FIELD_OFFICER:{name:'الضابط الميداني',desc:'الوصول السريع إلى ملف المنشأة وطلب التفتيش عند الحاجة.',mode:'field'}};
if(!session||!roleMeta[session.role]) location.replace('index.html');
const meta=roleMeta[session.role];document.getElementById('displayName').textContent=session.username||'ABDULLA ALMAJED';document.getElementById('roleTitle').textContent=meta.name;document.getElementById('roleBadge').textContent=meta.name;document.getElementById('pageTitle').textContent=meta.name;document.getElementById('pageDescription').textContent=meta.desc;
function logout(){localStorage.clear();location.replace('index.html')}
async function query(path,opt){return window.FireSafetyCentral?window.FireSafetyCentral.request(path,opt):[]}
const num=v=>Array.isArray(v)?v.length:0;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function dashboard(){const [assignments,violations,facilities,requests]=await Promise.all([query('inspection_assignments?select=*,facilities(facility_name,road,building_number)&order=scheduled_at.asc'),query('violations?select=*&order=created_at.desc'),query('facilities?select=*'),query('field_inspection_requests?select=*,facilities(facility_name)&order=created_at.desc')]);return{assignments,violations,facilities,requests}}
function stats(items){return `<div class="grid">${items.map(x=>`<div class="card"><span>${x.label}</span><b>${x.value}</b></div>`).join('')}</div>`}
async function centerOrExaminer(){const d=await dashboard();const isExaminer=meta.mode==='examiner';const visible=d.assignments.filter(a=>isExaminer||a.visit_type!=='Pre-Opening Inspection');workspace.innerHTML=stats([{label:'زيارات اليوم',value:num(visible)},{label:'مخالفات مفتوحة',value:d.violations.filter(v=>v.status==='Open').length},{label:'إعادة تفتيش',value:visible.filter(v=>v.visit_type==='Follow-Up Inspection').length},{label:'منشآت مسجلة',value:num(d.facilities)}])+`<section class="panel"><h2>${isExaminer?'الفحوصات المسندة وفحص ما قبل الافتتاح':'زيارات المخالفات والمتابعة'}</h2>${visible.length?visible.map(v=>`<div class="row"><div><b>${esc(v.facilities?.facility_name||'منشأة')}</b><small>${esc(v.visit_type)} · ${v.scheduled_at?new Date(v.scheduled_at).toLocaleString('ar-BH'):'موعد غير محدد'}</small></div><div><span class="badge">${esc(v.status)}</span> <button class="button" onclick="location.href='inspector.html'">تنفيذ الفحص</button></div></div>`).join(''):'<div class="empty">لا توجد زيارات مسندة حالياً.</div>'}</section>`}
async function reviewer(){const d=await dashboard();const pending=d.violations.filter(v=>v.review_status==='Pending Review'||v.review_status==='Returned');workspace.innerHTML=stats([{label:'بانتظار التدقيق',value:pending.length},{label:'مخالفات معتمدة',value:d.violations.filter(v=>v.review_status==='Approved').length},{label:'مخالفات مرفوضة',value:d.violations.filter(v=>v.review_status==='Rejected').length},{label:'تقارير جديدة',value:num(d.assignments.filter(a=>a.status==='Submitted'))}])+`<section class="panel"><h2>المخالفات بانتظار التدقيق</h2>${pending.length?pending.map(v=>`<div class="row"><div><b>${esc(v.title)}</b><small>${esc(v.violation_type)} · الحالة: ${esc(v.status)}</small></div><div><button class="button" onclick="reviewViolation('${v.id}','Approved')">اعتماد</button> <button class="button light" onclick="reviewViolation('${v.id}','Returned')">إعادة</button> <button class="button red" onclick="reviewViolation('${v.id}','Rejected')">رفض</button></div></div>`).join(''):'<div class="empty">لا توجد مخالفات بانتظار التدقيق.</div>'}</section>`}
async function reviewViolation(id,action){const reason=action==='Approved'?'تم التحقق من اكتمال البيانات':prompt('سبب القرار مطلوب:');if(!reason)return;await query(`violations?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({review_status:action,review_reason:reason,status:action==='Approved'?'Under Review':'Open',reviewed_at:new Date().toISOString()})});await query('violation_reviews',{method:'POST',body:JSON.stringify({violation_id:id,action,reason})});await query('audit_logs',{method:'POST',body:JSON.stringify({actor_role:session.role,operation:action+' violation',entity_type:'violation',entity_id:id,new_values:{action,reason}})});reviewer()}
async function commander(){const d=await dashboard();const high=d.facilities.filter(f=>f.hazardous_materials).length+d.violations.filter(v=>v.status==='Overdue'||v.status==='Open').length;workspace.innerHTML=stats([{label:'يحتاج تدخل',value:high},{label:'طلبات ميدانية',value:d.requests.filter(r=>r.status==='New').length},{label:'مخالفات متأخرة',value:d.violations.filter(v=>v.status==='Overdue').length},{label:'تقارير بانتظار التدقيق',value:d.violations.filter(v=>v.review_status==='Pending Review').length}])+`<div class="split"><section class="panel"><h2>طلبات التفتيش الميدانية</h2>${d.requests.length?d.requests.map(r=>`<div class="row"><div><b>${esc(r.facilities?.facility_name||'منشأة')}</b><small>${esc(r.reason)} · ${esc(r.priority)}</small></div><button class="button" onclick="approveRequest('${r.id}')">اعتماد الطلب</button></div>`).join(''):'<div class="empty">لا توجد طلبات ميدانية جديدة.</div>'}</section><section class="panel"><h2>المباني عالية الخطورة</h2>${d.facilities.filter(f=>f.hazardous_materials).map(f=>`<div class="row"><div><b>${esc(f.facility_name)}</b><small>مواد خطرة مسجلة</small></div><span class="badge urgent">HIGH</span></div>`).join('')||'<div class="empty">لا توجد بيانات خطر مركزية حالياً.</div>'}</section></div>`}
async function approveRequest(id){await query(`field_inspection_requests?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status:'Approved',reviewed_at:new Date().toISOString()})});await query('audit_logs',{method:'POST',body:JSON.stringify({actor_role:session.role,operation:'Approved field inspection request',entity_type:'field_inspection_request',entity_id:id})});commander()}
async function fieldOfficer(){workspace.innerHTML=`<section class="panel"><h2>البحث السريع عن منشأة</h2><div class="form"><input id="facilitySearch" placeholder="اسم المنشأة أو رقمها أو السجل أو المبنى"><button class="button" onclick="searchFacility()">بحث</button></div><div id="facilityResult" class="empty" style="margin-top:14px">ابحث عن منشأة لعرض معلومات السلامة والخرائط المسجلة.</div></section>`}
async function searchFacility(){const term=document.getElementById('facilitySearch').value.trim();if(!term)return;const rows=await query(`facilities?or=(facility_name.ilike.*${encodeURIComponent(term)}*,facility_number.ilike.*${encodeURIComponent(term)}*,registration_number.ilike.*${encodeURIComponent(term)}*,building_number.ilike.*${encodeURIComponent(term)}*)&select=*`);const box=document.getElementById('facilityResult');if(!rows.length){box.textContent='لا توجد منشأة مطابقة للبيانات المدخلة.';return}const f=rows[0];box.className='';box.innerHTML=`<section class="panel"><h2>${esc(f.facility_name)}</h2><div class="grid"><div class="card"><span>العنوان</span><b>${esc([f.governorate,f.area,f.road,f.building_number].filter(Boolean).join(' - '))||'غير مسجل'}</b></div><div class="card"><span>الطوابق / المخارج</span><b>${f.floors||'—'} / ${f.fire_exits||'—'}</b></div><div class="card"><span>المواد الخطرة</span><b>${f.hazardous_materials?'يوجد':'لا يوجد'}</b></div><div class="card"><span>الحالة</span><b>${esc(f.status||'Active')}</b></div></div><h2 style="margin-top:20px">طلب تفتيش</h2><div class="form"><select id="requestReason"><option>ملاحظة مخالفة</option><option>اشتباه في وجود نقص في أنظمة السلامة</option><option>معدات حماية غير متوفرة أو غير واضحة</option><option>تغيير في المبنى</option><option>مواد خطرة</option><option>حالة تحتاج مراجعة</option><option>أخرى</option></select><select id="requestPriority"><option>Normal</option><option>High</option><option>Urgent</option></select><input id="requestPhoto" type="file" accept="image/*" capture="environment"><textarea id="requestNote" placeholder="ملاحظة الضابط الميداني"></textarea><button class="button red" onclick="sendFieldRequest('${f.id}')">إرسال طلب التفتيش</button></div></section>`}
async function sendFieldRequest(facilityId){const reason=document.getElementById('requestReason').value,priority=document.getElementById('requestPriority').value,notes=document.getElementById('requestNote').value;const file=document.getElementById('requestPhoto').files[0];let photo_paths=[];if(file){photo_paths=[await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)})]}await query('field_inspection_requests',{method:'POST',body:JSON.stringify({facility_id:facilityId,reason,priority,notes,photo_paths,status:'New'})});await query('audit_logs',{method:'POST',body:JSON.stringify({actor_role:session.role,operation:'Created field inspection request',entity_type:'field_inspection_request',entity_id:facilityId,new_values:{reason,priority}})});alert('تم إرسال طلب التفتيش إلى ضابط التفتيش.');fieldOfficer()}
async function commander(){const d=await dashboard();const high=d.facilities.filter(f=>f.hazardous_materials).length+d.violations.filter(v=>v.status==='Overdue'||v.status==='Open').length;workspace.innerHTML=stats([{label:'يحتاج تدخل',value:high},{label:'طلبات ميدانية',value:d.requests.filter(r=>r.status==='New').length},{label:'مخالفات متأخرة',value:d.violations.filter(v=>v.status==='Overdue').length},{label:'تقارير بانتظار التدقيق',value:d.violations.filter(v=>v.review_status==='Pending Review').length}])+`<div class="split"><section class="panel"><h2>طلبات التفتيش الميدانية</h2>${d.requests.length?d.requests.map(r=>`<div class="row"><div><b>${esc(r.facilities?.facility_name||'منشأة')}</b><small>${esc(r.reason)} · ${esc(r.priority)} · ${new Date(r.created_at).toLocaleString('ar-BH')}</small></div><div><select id="assignee-${r.id}"><option value="abdulla.center">مفتش مركز</option><option value="abdulla.examiner">مفتش فاحص</option></select> <button class="button" onclick="assignFieldRequest('${r.id}','${r.facility_id}')">اعتماد وإسناد</button></div></div>`).join(''):'<div class="empty">لا توجد طلبات ميدانية جديدة.</div>'}</section><section class="panel"><h2>المباني عالية الخطورة</h2>${d.facilities.filter(f=>f.hazardous_materials).map(f=>`<div class="row"><div><b>${esc(f.facility_name)}</b><small>مواد خطرة مسجلة</small></div><span class="badge urgent">HIGH</span></div>`).join('')||'<div class="empty">لا توجد بيانات خطر مركزية حالياً.</div>'}</section></div>`}
async function assignFieldRequest(requestId,facilityId){const login=document.getElementById('assignee-'+requestId).value;const users=await query(`app_users?login_name=eq.${login}&select=id,role_code&limit=1`);if(!users.length){alert('تعذر العثور على المفتش المحدد.');return}const user=users[0];const rows=await query('inspection_assignments',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({facility_id:facilityId,inspector_id:user.id,visit_type:user.role_code==='INSPECTION_EXAMINER'?'Pre-Opening Inspection':'Violation Inspection',status:'Assigned',instructions:'تم إنشاؤها من طلب ضابط ميداني'})});await query(`field_inspection_requests?id=eq.${requestId}`,{method:'PATCH',body:JSON.stringify({status:'Assigned',assignment_id:rows[0]?.id,reviewed_at:new Date().toISOString()})});await query('audit_logs',{method:'POST',body:JSON.stringify({actor_role:session.role,operation:'Assigned field request',entity_type:'field_inspection_request',entity_id:requestId,new_values:{assignee:login,assignment_id:rows[0]?.id}})});commander()}
const workspace=document.getElementById('workspace');({center:centerOrExaminer,examiner:centerOrExaminer,review:reviewer,command:commander,field:fieldOfficer})[meta.mode]();
</script>
</body></html>
