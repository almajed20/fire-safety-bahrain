<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المفتشين - إدارة الحماية والسلامة من الحريق</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .card-shadow { box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* Custom Select Styles */
        .custom-select {
            position: relative;
        }
        
        .custom-select input {
            cursor: pointer;
        }
        
        .custom-select-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            margin-top: 4px;
        }
        
        .custom-select-dropdown.active {
            display: block;
        }
        
        .custom-select-option {
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .custom-select-option:hover {
            background-color: #f3f4f6;
        }
        
        .custom-select-search {
            position: sticky;
            top: 0;
            background: white;
            padding: 0.5rem;
            border-bottom: 1px solid #e5e7eb;
        }
        
        /* Violation Card Styles */
        .violation-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .violation-option {
            display: inline-block;
            padding: 0.5rem 1rem;
            margin: 0.25rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }
        
        .violation-option:hover {
            border-color: #6366f1;
            background: #eef2ff;
        }
        
        .violation-option.selected {
            border-color: #6366f1;
            background: #6366f1;
            color: white;
        }
        
        .violation-option.violation {
            border-color: #e5e7eb;
        }
        
        .violation-option.selected.violation {
            background: #6366f1;
            border-color: #6366f1;
        }
        
        .record-only-badge {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-right: 0.5rem;
        }
        
        .photo-preview {
            position: relative;
            display: inline-block;
            margin: 0.5rem;
        }
        
        .photo-preview img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .photo-preview button {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen gradient-bg flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg card-shadow w-full max-w-md">
            <div class="flex justify-between items-center mb-6">
                <!-- Ministry of Interior Logo - Right -->
                <div class="flex items-center">
                    <img src="interior_ministry_logo.png" alt="شعار وزارة الداخلية" class="w-16 h-16">
                </div>
                
                <!-- Civil Defense Logo - Left -->
                <div class="flex items-center">
                    <img src="civil_defense_logo.png" alt="شعار الدفاع المدني" class="w-16 h-16">
                </div>
            </div>
            
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">تسجيل دخول المفتشين</h2>
            </div>
            
            <form id="loginForm">
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">اسم المستخدم:</label>
                    <input type="text" id="username" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="أدخل اسم المستخدم" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2">كلمة المرور:</label>
                    <input type="password" id="password" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="أدخل كلمة المرور" required>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:from-indigo-700 hover:to-purple-700">
                    تسجيل الدخول
                </button>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" style="display: none;" class="min-h-screen p-4">
        <!-- Header -->
        <div class="bg-white rounded-lg p-4 card-shadow mb-4">
            <div class="flex justify-between items-center">
                <!-- Ministry of Interior Logo - Right -->
                <div class="flex items-center">
                    <img src="interior_ministry_logo.png" alt="شعار وزارة الداخلية" class="w-12 h-12">
                </div>
                
                <!-- Title and User Info - Center -->
                <div class="text-center flex-1">
                    <h1 class="text-xl font-bold text-gray-800">تطبيق المفتشين</h1>
                    <p class="text-sm text-gray-600" id="inspectorName">المفتش: <span></span></p>
                </div>
                
                <!-- Civil Defense Logo - Left -->
                <div class="flex items-center">
                    <img src="civil_defense_logo.png" alt="شعار الدفاع المدني" class="w-12 h-12">
                </div>
            </div>
            
            <div class="mt-4">
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg">
                    تسجيل الخروج
                </button>
            </div>
        </div>

        <!-- Inspection Form -->
        <div class="bg-white rounded-lg p-6 card-shadow">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">فحص منشأة جديدة</h2>
            
            <!-- Date, Time, Visit Number -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">التاريخ (تلقائي)</label>
                    <input type="text" id="inspectionDate" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-100" readonly>
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">الوقت (تلقائي)</label>
                    <input type="text" id="inspectionTime" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-100" readonly>
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">رقم الزيارة (تلقائي)</label>
                    <input type="text" id="visitNumber" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-100" readonly>
                </div>
            </div>

            <!-- Establishment Photos -->
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">صور المنشأة</label>
                <input type="file" id="establishmentPhotos" accept="image/*" capture="environment" multiple 
                       class="w-full p-3 border border-gray-300 rounded-lg" onchange="handleEstablishmentPhotos(event)">
                <div id="establishmentPhotosPreview" class="mt-2"></div>
            </div>

            <!-- Address Information -->
            <h3 class="text-xl font-bold text-gray-800 mb-4">معلومات العنوان</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div class="custom-select">
                    <label class="block text-gray-700 font-semibold mb-2">المحافظة *</label>
                    <input type="text" id="governorate" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="اختر المحافظة" readonly onclick="toggleDropdown('governorate')" required>
                    <div id="governorateDropdown" class="custom-select-dropdown"></div>
                </div>
                
                <div class="custom-select">
                    <label class="block text-gray-700 font-semibold mb-2">المنطقة *</label>
                    <input type="text" id="area" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="اختر المنطقة" readonly onclick="toggleDropdown('area')" required>
                    <div id="areaDropdown" class="custom-select-dropdown"></div>
                </div>
                
                <div class="custom-select">
                    <label class="block text-gray-700 font-semibold mb-2">المجمع *</label>
                    <input type="text" id="complex" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="اختر المجمع" readonly onclick="toggleDropdown('complex')" required>
                    <div id="complexDropdown" class="custom-select-dropdown"></div>
                </div>
                
                <div class="custom-select">
                    <label class="block text-gray-700 font-semibold mb-2">الطريق *</label>
                    <input type="text" id="road" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="اختر الطريق" readonly onclick="toggleDropdown('road')" required>
                    <div id="roadDropdown" class="custom-select-dropdown"></div>
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">رقم المبنى *</label>
                    <input type="text" id="buildingNumber" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="أدخل رقم المبنى" required>
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">رقم الشقة (اختياري)</label>
                    <input type="text" id="apartmentNumber" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="أدخل رقم الشقة">
                </div>
            </div>

            <!-- Establishment Information -->
            <h3 class="text-xl font-bold text-gray-800 mb-4">معلومات المنشأة</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div class="custom-select">
                    <label class="block text-gray-700 font-semibold mb-2">نوع المنشأة *</label>
                    <input type="text" id="establishmentType" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="اختر نوع المنشأة" readonly onclick="toggleDropdown('establishmentType')" required>
                    <div id="establishmentTypeDropdown" class="custom-select-dropdown"></div>
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">عدد الطوابق (اختياري)</label>
                    <input type="number" id="floors" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="أدخل عدد الطوابق">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">اسم المالك *</label>
                    <input type="text" id="ownerName" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="أدخل اسم المالك" required>
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">اسم المستأجر (اختياري)</label>
                    <input type="text" id="tenantName" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="أدخل اسم المستأجر">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">اسم المنشأة *</label>
                    <input type="text" id="establishmentName" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="أدخل اسم المنشأة" required>
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">رقم السجل (اختياري)</label>
                    <input type="text" id="registrationNumber" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="أدخل رقم السجل">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">الرقم الشخصي *</label>
                    <input type="text" id="personalId" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="أدخل الرقم الشخصي" required>
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">رقم الهاتف *</label>
                    <input type="tel" id="phoneNumber" class="w-full p-3 border border-gray-300 rounded-lg" 
                           placeholder="أدخل رقم الهاتف" required>
                </div>
            </div>

            <!-- Violations Section -->
            <h3 class="text-xl font-bold text-gray-800 mb-4">المخالفات</h3>
            <div id="violationsContainer"></div>

            <!-- Submit Buttons -->
            <div class="flex gap-4 mt-6">
                <button onclick="submitReport()" class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-lg font-semibold">
                    إرسال التقرير
                </button>
                <button onclick="resetForm()" class="bg-gray-500 hover:bg-gray-600 text-white px-8 py-3 rounded-lg font-semibold">
                    إعادة تعيين
                </button>
            </div>
        </div>
    </div>

    <script src="violations_inspector.js"></script>
    <script src="violation_prices.js"></script>
    <script>
        // Global variables
        let currentUser = null;
        let governoratesData = null;
        let roadsData = null;
        let selectedViolations = {};
        let establishmentPhotosData = [];

        // Load data files
        async function loadData() {
            try {
                const govResponse = await fetch('governorates_data.json');
                governoratesData = await govResponse.json();
                
                const roadsResponse = await fetch('roads_data.json');
                roadsData = await roadsResponse.json();
                
                console.log('Data loaded successfully');
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Initialize app
        window.onload = async function() {
            await loadData();
            initializeDateTime();
            initializeViolations();
            initializeEstablishmentTypes();
        };

        // Login functionality
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username === 'abdulla.almajed' && password === 'abdulla@20') {
                currentUser = { username: username, name: 'عبدالله العامجد' };
                localStorage.setItem('inspectorUser', JSON.stringify(currentUser));
                showMainApp();
            } else {
                alert('اسم المستخدم أو كلمة المرور غير صحيحة');
            }
        });

        function showMainApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('inspectorName').querySelector('span').textContent = currentUser.name;
            initializeGovernoratesDropdown();
        }

        function logout() {
            localStorage.removeItem('inspectorUser');
            currentUser = null;
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
            resetForm();
        }

        // Date and Time initialization
        function initializeDateTime() {
            const now = new Date();
            const date = now.toLocaleDateString('en-GB');
            const time = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            
            document.getElementById('inspectionDate').value = date;
            document.getElementById('inspectionTime').value = time;
            
            // Generate visit number
            const year = now.getFullYear();
            const visitCount = parseInt(localStorage.getItem('visitCount') || '0') + 1;
            document.getElementById('visitNumber').value = `${year}-${visitCount}`;
        }

        // Establishment photos handling
        function handleEstablishmentPhotos(event) {
            const files = Array.from(event.target.files);
            const previewContainer = document.getElementById('establishmentPhotosPreview');
            
            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    establishmentPhotosData.push(e.target.result);
                    
                    const photoDiv = document.createElement('div');
                    photoDiv.className = 'photo-preview';
                    photoDiv.innerHTML = `
                        <img src="${e.target.result}" alt="صورة المنشأة">
                        <button onclick="removeEstablishmentPhoto(${establishmentPhotosData.length - 1})">×</button>
                    `;
                    previewContainer.appendChild(photoDiv);
                };
                reader.readAsDataURL(file);
            });
        }

        function removeEstablishmentPhoto(index) {
            establishmentPhotosData.splice(index, 1);
            const previewContainer = document.getElementById('establishmentPhotosPreview');
            previewContainer.innerHTML = '';
            establishmentPhotosData.forEach((photo, idx) => {
                const photoDiv = document.createElement('div');
                photoDiv.className = 'photo-preview';
                photoDiv.innerHTML = `
                    <img src="${photo}" alt="صورة المنشأة">
                    <button onclick="removeEstablishmentPhoto(${idx})">×</button>
                `;
                previewContainer.appendChild(photoDiv);
            });
        }

        // Dropdown functionality
        function initializeGovernoratesDropdown() {
            const dropdown = document.getElementById('governorateDropdown');
            dropdown.innerHTML = '<div class="custom-select-search"><input type="text" placeholder="ابحث..." onkeyup="filterOptions(\'governorate\', this.value)" class="w-full p-2 border border-gray-300 rounded"></div>';
            
            for (const gov in governoratesData) {
                const option = document.createElement('div');
                option.className = 'custom-select-option';
                option.textContent = gov;
                option.onclick = () => selectGovernorate(gov);
                dropdown.appendChild(option);
            }
        }

        function selectGovernorate(gov) {
            document.getElementById('governorate').value = gov;
            document.getElementById('governorateDropdown').classList.remove('active');
            
            // Update areas dropdown
            const areasDropdown = document.getElementById('areaDropdown');
            areasDropdown.innerHTML = '<div class="custom-select-search"><input type="text" placeholder="ابحث..." onkeyup="filterOptions(\'area\', this.value)" class="w-full p-2 border border-gray-300 rounded"></div>';
            
            governoratesData[gov].areas.forEach(area => {
                const option = document.createElement('div');
                option.className = 'custom-select-option';
                option.textContent = area;
                option.onclick = () => selectArea(area);
                areasDropdown.appendChild(option);
            });
            
            // Update complexes dropdown
            const complexesDropdown = document.getElementById('complexDropdown');
            complexesDropdown.innerHTML = '<div class="custom-select-search"><input type="text" placeholder="ابحث..." onkeyup="filterOptions(\'complex\', this.value)" class="w-full p-2 border border-gray-300 rounded"></div>';
            
            governoratesData[gov].complexes.forEach(complex => {
                const option = document.createElement('div');
                option.className = 'custom-select-option';
                option.textContent = complex;
                option.onclick = () => selectComplex(complex);
                complexesDropdown.appendChild(option);
            });
            
            // Clear area, complex, and road selections
            document.getElementById('area').value = '';
            document.getElementById('complex').value = '';
            document.getElementById('road').value = '';
        }

        function selectArea(area) {
            document.getElementById('area').value = area;
            document.getElementById('areaDropdown').classList.remove('active');
            
            // Update roads dropdown based on area
            updateRoadsDropdown(area);
        }

        function selectComplex(complex) {
            document.getElementById('complex').value = complex;
            document.getElementById('complexDropdown').classList.remove('active');
        }

        function updateRoadsDropdown(area) {
            const roadsDropdown = document.getElementById('roadDropdown');
            roadsDropdown.innerHTML = '<div class="custom-select-search"><input type="text" placeholder="ابحث..." onkeyup="filterOptions(\'road\', this.value)" class="w-full p-2 border border-gray-300 rounded"></div>';
            
            // Find roads for this area
            if (roadsData && roadsData[area]) {
                roadsData[area].forEach(road => {
                    const option = document.createElement('div');
                    option.className = 'custom-select-option';
                    option.textContent = road;
                    option.onclick = () => selectRoad(road);
                    roadsDropdown.appendChild(option);
                });
            }
        }

        function selectRoad(road) {
            document.getElementById('road').value = road;
            document.getElementById('roadDropdown').classList.remove('active');
        }

        function toggleDropdown(fieldName) {
            const dropdown = document.getElementById(fieldName + 'Dropdown');
            const allDropdowns = document.querySelectorAll('.custom-select-dropdown');
            
            allDropdowns.forEach(d => {
                if (d !== dropdown) {
                    d.classList.remove('active');
                }
            });
            
            dropdown.classList.toggle('active');
        }

        function filterOptions(fieldName, searchText) {
            const dropdown = document.getElementById(fieldName + 'Dropdown');
            const options = dropdown.querySelectorAll('.custom-select-option');
            
            options.forEach(option => {
                const text = option.textContent;
                if (text.includes(searchText)) {
                    option.style.display = 'block';
                } else {
                    option.style.display = 'none';
                }
            });
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.custom-select')) {
                document.querySelectorAll('.custom-select-dropdown').forEach(d => {
                    d.classList.remove('active');
                });
            }
        });

        // Initialize establishment types
        function initializeEstablishmentTypes() {
            const types = ['مصنع', 'مبنى سكني', 'مستودع', 'منشأة تجارية', 'مبنى تجاري'];
            const dropdown = document.getElementById('establishmentTypeDropdown');
            dropdown.innerHTML = '';
            
            types.forEach(type => {
                const option = document.createElement('div');
                option.className = 'custom-select-option';
                option.textContent = type;
                option.onclick = () => {
                    document.getElementById('establishmentType').value = type;
                    dropdown.classList.remove('active');
                };
                dropdown.appendChild(option);
            });
        }

        // Initialize violations
        function initializeViolations() {
            const container = document.getElementById('violationsContainer');
            container.innerHTML = '';
            
            inspectorViolations.forEach((violation, index) => {
                const card = document.createElement('div');
                card.className = 'violation-card';
                card.id = `violation-${violation.id}`;
                
                let optionsHtml = '';
                violation.options.forEach(option => {
                    const recordOnlyBadge = ''; // إزالة عرض البالون
                    const violationClass = option.isViolation ? 'violation' : '';
                    optionsHtml += `
                        <div class="violation-option ${violationClass}" 
                             data-violation-id="${violation.id}" 
                             data-option-value="${option.value}"
                             onclick="toggleViolationOption('${violation.id}', '${option.value}', ${option.isViolation}, ${option.recordOnly || false})">
                            ${recordOnlyBadge}${option.label}
                        </div>
                    `;
                });
                
                card.innerHTML = `
                    <h4 class="text-lg font-bold text-gray-800 mb-3">${violation.name}</h4>
                    <div class="mb-3">${optionsHtml}</div>
                    
                    <div id="violation-${violation.id}-details" style="display: none;">
                        <div class="mb-3">
                            <label class="block text-gray-700 font-semibold mb-2">ملاحظات</label>
                            <textarea id="violation-${violation.id}-notes" class="w-full p-3 border border-gray-300 rounded-lg" rows="3" placeholder="أدخل ملاحظات..."></textarea>
                        </div>
                        
                        ${violation.id === 'other_violations' ? `
                            <div class="mb-3">
                                <label class="block text-gray-700 font-semibold mb-2">تفاصيل المخالفة</label>
                                <textarea id="violation-${violation.id}-custom-text" class="w-full p-3 border border-gray-300 rounded-lg" rows="3" placeholder="اكتب تفاصيل المخالفة..."></textarea>
                            </div>
                        ` : ''}
                        
                        <div class="mb-3">
                            <label class="block text-gray-700 font-semibold mb-2">صور المخالفة</label>
                            <input type="file" id="violation-${violation.id}-photos" accept="image/*" capture="environment" multiple 
                                   class="w-full p-3 border border-gray-300 rounded-lg" 
                                   onchange="handleViolationPhotos('${violation.id}', event)">
                            <div id="violation-${violation.id}-photos-preview" class="mt-2"></div>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        function toggleViolationOption(violationId, optionValue, isViolation, recordOnly) {
            const option = event.target;
            option.classList.toggle('selected');
            
            // Initialize violation data if not exists
            if (!selectedViolations[violationId]) {
                selectedViolations[violationId] = {
                    options: [],
                    notes: '',
                    photos: [],
                    customText: ''
                };
            }
            
            // Toggle option in selected options
            const optionIndex = selectedViolations[violationId].options.findIndex(o => o.value === optionValue);
            if (optionIndex > -1) {
                selectedViolations[violationId].options.splice(optionIndex, 1);
            } else {
                selectedViolations[violationId].options.push({
                    value: optionValue,
                    isViolation: isViolation,
                    recordOnly: recordOnly
                });
            }
            
            // Show/hide details section
            const detailsSection = document.getElementById(`violation-${violationId}-details`);
            if (selectedViolations[violationId].options.length > 0) {
                detailsSection.style.display = 'block';
            } else {
                detailsSection.style.display = 'none';
            }
        }

        function handleViolationPhotos(violationId, event) {
            const files = Array.from(event.target.files);
            const previewContainer = document.getElementById(`violation-${violationId}-photos-preview`);
            
            if (!selectedViolations[violationId]) {
                selectedViolations[violationId] = { options: [], notes: '', photos: [], customText: '' };
            }
            
            files.forEach((file) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedViolations[violationId].photos.push(e.target.result);
                    
                    const photoDiv = document.createElement('div');
                    photoDiv.className = 'photo-preview';
                    photoDiv.innerHTML = `
                        <img src="${e.target.result}" alt="صورة المخالفة">
                        <button onclick="removeViolationPhoto('${violationId}', ${selectedViolations[violationId].photos.length - 1})">×</button>
                    `;
                    previewContainer.appendChild(photoDiv);
                };
                reader.readAsDataURL(file);
            });
        }

        function removeViolationPhoto(violationId, index) {
            selectedViolations[violationId].photos.splice(index, 1);
            const previewContainer = document.getElementById(`violation-${violationId}-photos-preview`);
            previewContainer.innerHTML = '';
            selectedViolations[violationId].photos.forEach((photo, idx) => {
                const photoDiv = document.createElement('div');
                photoDiv.className = 'photo-preview';
                photoDiv.innerHTML = `
                    <img src="${photo}" alt="صورة المخالفة">
                    <button onclick="removeViolationPhoto('${violationId}', ${idx})">×</button>
                `;
                previewContainer.appendChild(photoDiv);
            });
        }

        // Submit report
        async function submitReport() {
            // Validate required fields
            const requiredFields = ['governorate', 'area', 'complex', 'road', 'buildingNumber', 
                                   'establishmentType', 'ownerName', 'establishmentName', 
                                   'personalId', 'phoneNumber'];
            
            for (const field of requiredFields) {
                if (!document.getElementById(field).value) {
                    alert('الرجاء ملء جميع الحقول المطلوبة');
                    return;
                }
            }
            
            // Check if at least one of: registrationNumber, personalId, or phoneNumber is filled
            const registrationNumber = document.getElementById('registrationNumber').value;
            const personalId = document.getElementById('personalId').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            
            if (!registrationNumber && !personalId && !phoneNumber) {
                alert('يجب إدخال رقم السجل أو الرقم الشخصي أو رقم الهاتف على الأقل');
                return;
            }
            
            // Collect violation notes and custom text
            for (const violationId in selectedViolations) {
                const notesElement = document.getElementById(`violation-${violationId}-notes`);
                if (notesElement) {
                    selectedViolations[violationId].notes = notesElement.value;
                }
                
                const customTextElement = document.getElementById(`violation-${violationId}-custom-text`);
                if (customTextElement) {
                    selectedViolations[violationId].customText = customTextElement.value;
                }
            }
            
            // Prepare inspection data
            const inspectionData = {
                inspector: currentUser.name,
                date: document.getElementById('inspectionDate').value,
                time: document.getElementById('inspectionTime').value,
                visitNumber: document.getElementById('visitNumber').value,
                establishmentPhotos: establishmentPhotosData,
                address: {
                    governorate: document.getElementById('governorate').value,
                    area: document.getElementById('area').value,
                    complex: document.getElementById('complex').value,
                    road: document.getElementById('road').value,
                    buildingNumber: document.getElementById('buildingNumber').value,
                    apartmentNumber: document.getElementById('apartmentNumber').value
                },
                establishment: {
                    type: document.getElementById('establishmentType').value,
                    floors: document.getElementById('floors').value,
                    ownerName: document.getElementById('ownerName').value,
                    tenantName: document.getElementById('tenantName').value,
                    name: document.getElementById('establishmentName').value,
                    registrationNumber: document.getElementById('registrationNumber').value,
                    personalId: document.getElementById('personalId').value,
                    phoneNumber: document.getElementById('phoneNumber').value
                },
                violations: selectedViolations,
                timestamp: new Date().toISOString()
            };
            
            // Check if there are any violations
            const hasViolations = Object.keys(selectedViolations).some(violationId => {
                return selectedViolations[violationId].options.some(opt => opt.isViolation);
            });
            
            // Save to localStorage (simulating API call)
            const inspections = JSON.parse(localStorage.getItem('inspections') || '[]');
            inspections.push(inspectionData);
            localStorage.setItem('inspections', JSON.stringify(inspections));
            
            // Update visit count
            const currentVisitCount = parseInt(localStorage.getItem('visitCount') || '0');
            localStorage.setItem('visitCount', (currentVisitCount + 1).toString());
            
            // Calculate violations summary
            let violationsSummary = [];
            let totalAmount = 0;
            
            for (const violationId in selectedViolations) {
                const violation = inspectorViolations.find(v => v.id === violationId);
                if (!violation) continue;
                
                const violationOptions = selectedViolations[violationId].options.filter(opt => opt.isViolation);
                if (violationOptions.length > 0) {
                    const violationPrice = violationPrices[violationId] || 1000;
                    totalAmount += violationPrice;
                    violationsSummary.push({
                        name: violation.name,
                        price: violationPrice
                    });
                }
            }
            
            // Show success message with violations summary
            if (hasViolations) {
                let summaryText = 'تم إرسال التقرير بنجاح!\n\nملخص المخالفات:\n';
                violationsSummary.forEach((v, index) => {
                    summaryText += `${index + 1}. ${v.name}: ${v.price} دينار بحريني\n`;
                });
                summaryText += `\nالمجموع الكلي: ${totalAmount} دينار بحريني`;
                alert(summaryText);
            } else {
                alert('تم حفظ الفحص بنجاح! لا توجد مخالفات، تم الحفظ في المباني المفحوصة.');
            }
            
            // Reset form
            resetForm();
        }

        function resetForm() {
            // Reset all input fields
            document.querySelectorAll('input[type="text"], input[type="tel"], input[type="number"], textarea').forEach(input => {
                if (!input.readOnly) {
                    input.value = '';
                }
            });
            
            // Reset dropdowns
            document.getElementById('governorate').value = '';
            document.getElementById('area').value = '';
            document.getElementById('complex').value = '';
            document.getElementById('road').value = '';
            document.getElementById('establishmentType').value = '';
            
            // Reset violations
            selectedViolations = {};
            document.querySelectorAll('.violation-option.selected').forEach(option => {
                option.classList.remove('selected');
            });
            document.querySelectorAll('[id$="-details"]').forEach(details => {
                details.style.display = 'none';
            });
            
            // Reset photos
            establishmentPhotosData = [];
            document.getElementById('establishmentPhotosPreview').innerHTML = '';
            document.querySelectorAll('[id$="-photos-preview"]').forEach(preview => {
                preview.innerHTML = '';
            });
            
            // Reset date and time
            initializeDateTime();
        }
    </script>
